[project]
name = "legaloo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Myakey", email = "goldenation139@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "bcrypt>=5.0.0",
    "fastapi>=0.117",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.15.1",
]


[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "uvicorn[standard]>=0.32",
]
ingest = [
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
